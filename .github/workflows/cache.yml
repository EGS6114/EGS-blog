name: Vercel 缓存

on:
  push:
    branches: [main]
  workflow_dispatch:  

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 等待 Vercel 部署完成
        run: sleep 120

      - name: 提取 sitemap
        run: |
          curl -s -m 30 https://upxuu.com/sitemap.xml \
            | grep -oP '(?<=<loc>)[^<]+' \
            | sed 's/\r$//' > urls.txt
          echo "共提取 $(wc -l < urls.txt) 个页面"


      - name: 预热边缘缓存
        run: |
          cat urls.txt | xargs -P 8 -I {} curl -s -o /dev/null -m 20 "{}" || true

      - name: 检查缓存命中率
        run: |
          total=0; hit=0; miss=0
          : > detail.txt
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            total=$((total+1))
            cache=$(curl -s -o /dev/null -m 20 -D - "$url" \
              | grep -i '^x-vercel-cache:' | tr -d '\r' | awk '{print $2}')
            [ -z "$cache" ] && cache="N/A"
            if [ "$cache" = "HIT" ]; then hit=$((hit+1)); else miss=$((miss+1)); fi
            echo "$cache|$url" >> detail.txt
          done < urls.txt

          if [ "$total" -gt 0 ]; then
            rate=$(awk "BEGIN{printf \"%.1f\", $hit*100.0/$total}")
          else
            rate="0.0"
          fi

          {
            echo "# Vercel 边缘缓存预热报告"
            echo ""
            echo "> 生成时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| 指标 | 数值 |"
            echo "|------|------|"
            echo "| 总页面数 | $total |"
            echo "| 命中 HIT | $hit |"
            echo "| 未命中 MISS | $miss |"
            echo "| 命中率 | $rate% |"
            echo ""
            echo "## 详细状态"
            echo ""
            echo "| 状态 | URL |"
            echo "|------|-----|"
            while IFS='|' read -r cache url; do
              echo "| $cache | $url |"
            done < detail.txt
          } > HIT.txt

          cat HIT.txt

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: cache-report
          path: HIT.txt
          retention-days: 7